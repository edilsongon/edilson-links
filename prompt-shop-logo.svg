<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Shop IA</title>
  <desc id="desc">Sacola de compras com símbolo de prompt e brilho de inteligência artificial</desc>
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a5b"/>
      <stop offset="1" stop-color="#091523"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdc8a"/>
      <stop offset="1" stop-color="#e6a934"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f0b94b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f0b94b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <circle cx="256" cy="268" r="222" fill="url(#glow)"/>
