    <path d="M122 190c0-18 14-32 32-32h204c18 0 32 14 32 32l-16 206c-2 20-18 35-38 35H176c-20 0-36-15-38-35z" fill="url(#bag)" stroke="url(#gold)" stroke-width="8"/>
    <path d="M190 171v-21c0-39 27-69 66-69s66 30 66 69v21" fill="none" stroke="#ffdc8a" stroke-width="12" stroke-linecap="round"/>
    <rect x="171" y="225" width="170" height="112" rx="24" fill="#07111f" stroke="#ffffff" stroke-opacity=".16" stroke-width="3"/>
    <path d="m205 261 31 20-31 20" fill="none" stroke="#ffdc8a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 302h49" fill="none" stroke="#f8fbff" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g fill="#ffdc8a">
    <path d="M385 81c3 19 12 28 31 31-19 3-28 12-31 31-3-19-12-28-31-31 19-3 28-12 31-31z"/>
    <path d="M426 148c2 11 7 16 18 18-11 2-16 7-18 18-2-11-7-16-18-18 11-2 16-7 18-18z" opacity=".72"/>
